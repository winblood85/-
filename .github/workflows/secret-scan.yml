# Проверяет каждый push и PR на случайно закоммиченные секреты (токены, ключи, пароли).
name: Secret scan

on:
  push:
  pull_request:

# Минимальные права для токена CI
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Actions закреплены по SHA коммита, чтобы подмена тега не повлияла на CI
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
